<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動檔期甘特圖</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-page:      #f2f0ec;
    --bg-card:      #ffffff;
    --bg-soft:      #f7f6f3;
    --text-1:       #1f1e1c;
    --text-2:       #5f5e5a;
    --text-3:       #8e8d87;
    --line:         #e4e2dc;
    --line-strong:  #cfcdc6;
    --accent:       #3C3489;
    --radius-md:    8px;
    --radius-lg:    12px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    background: var(--bg-page);
    color: var(--text-1);
    min-height: 100vh;
    padding: 1.5rem 1.25rem 3rem;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1060px; margin: 0 auto; }

  /* ── header ── */
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px;
  }
  .page-title {
    font-size: 20px; font-weight: 600; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 9px;
  }
  .page-title i { font-size: 22px; color: var(--accent); }

  .sync-info {
    font-size: 12px; color: var(--text-3);
    display: flex; align-items: center; gap: 7px;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #b6b4ad; flex-shrink: 0; }
  .sync-dot.ok  { background: #1D9E75; }
  .sync-dot.err { background: #E24B4A; }

  /* ── card ── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 1.25rem 1.4rem 1.4rem;
  }

  /* ── controls ── */
  .controls {
    display: flex; align-items: flex-end; gap: 10px;
    flex-wrap: wrap; padding-bottom: 1rem;
    border-bottom: 1px solid var(--line); margin-bottom: 1rem;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-group label {
    font-size: 11px; color: var(--text-3);
    letter-spacing: .03em; font-weight: 500;
  }
  .ctrl-row { display: flex; align-items: center; gap: 6px; }

  input[type="date"], select {
    font-family: inherit; font-size: 13px;
    padding: 6px 9px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line-strong);
    background: var(--bg-card); color: var(--text-1);
    cursor: pointer;
  }
  input[type="date"]:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(60,52,137,.12);
  }
  .date-sep { color: var(--text-3); font-size: 13px; }

  .btn {
    font-family: inherit; font-size: 13px;
    padding: 6px 13px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line-strong);
    background: var(--bg-card); color: var(--text-1);
    cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: var(--bg-soft); border-color: var(--text-3); }
  .btn:active { transform: scale(.98); }
  .btn.icon-only { padding: 6px 9px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #4b42a8; border-color: #4b42a8; }
  .btn.sm { font-size: 12px; padding: 4px 10px; }

  .preset-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .preset {
    font-family: inherit; font-size: 12px;
    padding: 5px 11px; border-radius: 20px;
    border: 1px solid var(--line-strong);
    background: var(--bg-card); color: var(--text-2);
    cursor: pointer; white-space: nowrap;
    transition: all .12s;
  }
  .preset:hover { background: var(--bg-soft); }
  .preset.on {
    background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 500;
  }

  .spacer { flex: 1; min-width: 4px; }

  /* ── filters ── */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: .85rem; }
  .pill {
    font-size: 12px; padding: 4px 11px;
    border-radius: 20px;
    border: 1px solid var(--line-strong);
    background: var(--bg-card); color: var(--text-2);
    cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s;
  }
  .pill:hover { background: var(--bg-soft); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pill.on { font-weight: 500; }
  .pill.off { opacity: .4; }

  /* ── item manager ── */
  .manager-bar {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap; margin-bottom: .85rem;
  }
  .manager-toggle {
    font-family: inherit; font-size: 12px;
    padding: 5px 11px; border-radius: var(--radius-md);
    border: 1px solid var(--line-strong);
    background: var(--bg-card); color: var(--text-2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: all .12s;
  }
  .manager-toggle:hover { background: var(--bg-soft); }
  .manager-toggle.open { border-color: var(--accent); color: var(--accent); background: rgba(60,52,137,.05); }
  .hidden-count {
    font-size: 11px; color: var(--text-3);
    display: inline-flex; align-items: center; gap: 5px;
  }

  .manager-panel {
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--bg-soft);
    padding: .9rem 1rem;
    margin-bottom: .9rem;
  }
  .manager-actions {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding-bottom: .7rem; margin-bottom: .7rem;
    border-bottom: 1px solid var(--line);
  }
  .manager-group { margin-bottom: .8rem; }
  .manager-group:last-child { margin-bottom: 0; }
  .manager-group-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 600; color: var(--text-2);
    letter-spacing: .03em; margin-bottom: 6px;
  }
  .manager-group-head .gdot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .manager-group-head button {
    font-family: inherit; font-size: 10.5px;
    background: none; border: none; color: var(--text-3);
    cursor: pointer; text-decoration: underline; padding: 0;
  }
  .manager-group-head button:hover { color: var(--accent); }

  .item-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 2px 14px;
  }
  .item-check {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--text-1);
    padding: 3px 5px; border-radius: 5px;
    cursor: pointer; user-select: none;
    transition: background .1s;
  }
  .item-check:hover { background: rgba(0,0,0,.035); }
  .item-check input { cursor: pointer; accent-color: var(--accent); flex-shrink: 0; margin: 0; }
  .item-check span {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-check.off span { color: var(--text-3); text-decoration: line-through; }
  .item-date { font-size: 10.5px; color: var(--text-3); flex-shrink: 0; margin-left: auto; }

  /* ── gantt ── */
  .gantt-wrap { overflow-x: auto; }
  .gantt {
    min-width: 700px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg-card);
  }
  .gantt-head {
    display: grid; background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .head-label {
    font-size: 12px; color: var(--text-2); font-weight: 500;
    padding: 8px 12px; border-right: 1px solid var(--line);
    display: flex; align-items: center;
    background: var(--bg-soft);
  }
  .months-row { display: flex; border-bottom: 1px solid var(--line); }
  .month-cell {
    font-size: 11px; color: var(--text-2); font-weight: 500;
    padding: 4px 6px; border-right: 1px solid var(--line);
    text-align: center; flex-shrink: 0; white-space: nowrap; overflow: hidden;
  }
  .ticks-row { display: flex; }
  .tick-cell {
    font-size: 10px; color: var(--text-3);
    text-align: center; border-right: 1px solid var(--line);
    padding: 4px 1px; flex-shrink: 0; overflow: hidden; white-space: nowrap;
  }
  .tick-cell.is-today { color: #E24B4A; font-weight: 600; }
  .tick-cell.weekend { background: rgba(0,0,0,.022); }

  .gantt-row {
    display: grid; border-bottom: 1px solid var(--line);
    min-height: 46px;
  }
  .gantt-row:last-child { border-bottom: none; }
  .gantt-row:hover { background: rgba(60,52,137,.028); }

  .row-info {
    padding: 8px 10px 8px 12px; border-right: 1px solid var(--line);
    display: flex; align-items: center; gap: 8px; overflow: hidden;
  }
  .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row-name {
    font-size: 13px; font-weight: 500; color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-badge {
    font-size: 10.5px; padding: 2px 7px; border-radius: 4px;
    display: inline-block; width: fit-content; white-space: nowrap;
  }
  .row-hide {
    background: none; border: none; cursor: pointer;
    color: var(--text-3); font-size: 15px; padding: 3px;
    border-radius: 5px; flex-shrink: 0;
    opacity: 0; transition: opacity .12s, background .12s, color .12s;
  }
  .gantt-row:hover .row-hide { opacity: 1; }
  .row-hide:hover { background: rgba(0,0,0,.06); color: var(--text-1); }

  .row-timeline { position: relative; overflow: hidden; min-height: 46px; }
  .bar {
    position: absolute; top: 9px; bottom: 9px;
    border-radius: 4px;
    display: flex; align-items: center; padding: 0 8px;
    font-size: 11px; font-weight: 500;
    white-space: nowrap; overflow: hidden;
    transition: filter .15s;
  }
  .bar:hover { filter: brightness(1.08); }
  .bar.clip-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .bar.clip-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }

  .today-line {
    position: absolute; top: 0; bottom: 0;
    width: 1.5px; background: #E24B4A; opacity: .55;
    pointer-events: none; z-index: 3;
  }

  /* ── states ── */
  .state-box {
    text-align: center; padding: 3.5rem 1rem;
    color: var(--text-2); font-size: 14px;
  }
  .state-box i { font-size: 30px; display: block; margin: 0 auto 10px; opacity: .35; }
  .state-box small { opacity: .65; font-size: 12px; }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── legend ── */
  .legend-wrap {
    display: flex; gap: 1.75rem; flex-wrap: wrap;
    padding-top: 0.9rem; margin-top: 1rem;
    border-top: 1px solid var(--line);
  }
  .legend-title {
    font-size: 10.5px; color: var(--text-3); font-weight: 600;
    letter-spacing: .05em; margin-bottom: 6px;
  }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-2); margin-bottom: 5px;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  .footnote {
    font-size: 11.5px; color: var(--text-3);
    text-align: center; margin-top: 1rem; line-height: 1.6;
  }

  /* ── 截圖模式 ── */
  body.shot-mode { background: #fff; padding-top: 1rem; }
  body.shot-mode .controls,
  body.shot-mode .manager-bar,
  body.shot-mode .manager-panel,
  body.shot-mode .footnote,
  body.shot-mode .sync-info { display: none !important; }
  body.shot-mode .card { border: none; padding: 0; }
  body.shot-mode .page-header { margin-bottom: .75rem; }
  body.shot-mode .row-hide { display: none; }
  body.shot-mode .filters { margin-bottom: .75rem; }
  body.shot-mode .shot-exit { display: inline-flex !important; }
  .shot-exit { display: none; }

  @media (max-width: 640px) {
    body { padding: 1rem .75rem 2rem; }
    .card { padding: 1rem; }
    .controls { gap: 8px; }
    .item-list { grid-template-columns: 1fr; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .controls, .manager-bar, .manager-panel, .footnote, .sync-info, .row-hide { display: none !important; }
    .card { border: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="page-header">
    <div class="page-title">
      <i class="ti ti-calendar-event"></i>活動檔期甘特圖
    </div>
    <div class="sync-info">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncLabel">載入中…</span>
      <button class="btn icon-only" id="refreshBtn" title="重新讀取"><i class="ti ti-refresh"></i></button>
    </div>
    <button class="btn sm shot-exit" id="shotExit"><i class="ti ti-x"></i>離開截圖模式</button>
  </div>

  <div class="card">

    <div class="controls">
      <div class="ctrl-group">
        <label>顯示期間</label>
        <div class="ctrl-row">
          <input type="date" id="dStart">
          <span class="date-sep">–</span>
          <input type="date" id="dEnd">
        </div>
      </div>

      <div class="ctrl-group">
        <label>快速選擇</label>
        <div class="preset-row" id="presets">
          <button class="preset" data-preset="thisMonth">本月</button>
          <button class="preset" data-preset="nextMonth">下個月</button>
          <button class="preset on" data-preset="q">本季</button>
          <button class="preset" data-preset="h1">上半年</button>
          <button class="preset" data-preset="h2">下半年</button>
          <button class="preset" data-preset="year">全年</button>
          <button class="preset" data-preset="all">全部活動</button>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="ctrl-group">
        <label>&nbsp;</label>
        <div class="ctrl-row">
          <button class="btn" id="todayBtn"><i class="ti ti-target"></i>跳到今天</button>
          <button class="btn" id="shotBtn"><i class="ti ti-camera"></i>截圖模式</button>
        </div>
      </div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="manager-bar">
      <button class="manager-toggle" id="mgrToggle">
        <i class="ti ti-list-check"></i>挑選顯示項目
        <i class="ti ti-chevron-down" id="mgrChevron" style="font-size:13px"></i>
      </button>
      <span class="hidden-count" id="hiddenCount"></span>
    </div>

    <div class="manager-panel" id="mgrPanel" style="display:none">
      <div class="manager-actions">
        <button class="btn sm" id="mgrAll"><i class="ti ti-eye"></i>全部顯示</button>
        <button class="btn sm" id="mgrNone"><i class="ti ti-eye-off"></i>全部隱藏</button>
        <button class="btn sm" id="mgrInvert"><i class="ti ti-switch-horizontal"></i>反向選擇</button>
        <button class="btn sm" id="mgrInRange"><i class="ti ti-calendar-check"></i>只留期間內</button>
      </div>
      <div id="mgrGroups"></div>
    </div>

    <div class="gantt-wrap">
      <div class="gantt" id="gantt">
        <div class="state-box"><div class="spinner"></div>從 Google Sheets 讀取資料中…</div>
      </div>
    </div>

    <div class="legend-wrap" id="legendArea"></div>
  </div>

  <div class="footnote">
    資料來源：Google Sheets「2026 行銷活動行事曆 › 總覽」<br>
    在試算表更新後，點右上角重新整理即可同步
  </div>

</div>

<script>
/* ══════════════ 設定區 ══════════════ */
const SHEET_ID   = '1Y9Lvd9WWhSosPDQewrWEDShJTpKlFfMuryEGYhzUYvo';
const SHEET_NAME = '總覽';
/* ═════════════════════════════════════ */

const CATS = {
  '品牌異業':       { color: '#1D9E75', group: 'main' },
  '會員活動':       { color: '#534AB7', group: 'main' },
  '廣告置入':       { color: '#2E7FC4', group: 'main' },
  'KOL - 導購分潤': { color: '#D85A30', group: 'kol'  },
  'KOL - 業配置入': { color: '#B57614', group: 'kol'  },
  'KOL - 綜合':     { color: '#C4437A', group: 'kol'  },
};
const CAT_ORDER = Object.keys(CATS);
function getCat(n){ return CATS[n] || { color:'#8e8d87', group:'main' }; }

let allEvents     = [];
let activeFilters = new Set(CAT_ORDER);
let hiddenIds     = new Set();   // 被個別隱藏的活動
let rangeStart = null, rangeEnd = null;

/* ── 日期工具 ── */
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function toISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function fromISO(s){ const p=s.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0); return d; }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function shortDate(iso){ const p=iso.split('-'); return `${+p[1]}/${+p[2]}`; }
function parseDate(s){
  if(!s) return null;
  s = s.trim().replace(/\//g,'-');
  const p = s.split('-');
  if(p.length!==3) return null;
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setHours(0,0,0,0);
  return isNaN(d.getTime()) ? null : d;
}

/* ── 讀取 Sheets ── */
async function fetchSheets(){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return parseCSV(await r.text());
}
function splitCSVLine(line){
  const out=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){ if(inQ && line[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; continue; }
    if(c===',' && !inQ){ out.push(cur); cur=''; continue; }
    cur+=c;
  }
  out.push(cur); return out;
}
function parseCSV(text){
  const lines = text.trim().split(/\r?\n/);
  const evs = [];
  for(let i=1;i<lines.length;i++){
    const c = splitCSVLine(lines[i]);
    if(c.length<4) continue;
    const s=parseDate(c[0]), e=parseDate(c[1]);
    const name=(c[2]||'').trim(), cat=(c[3]||'').trim();
    if(!s||!e||!name) continue;
    evs.push({ id:'r'+i, start:toISO(s), end:toISO(e), name, cat });
  }
  return evs;
}

/* ── 同步狀態 ── */
function setSync(state, t){
  const dot=document.getElementById('syncDot'), lb=document.getElementById('syncLabel');
  dot.className='sync-dot';
  if(state==='ok'){ dot.classList.add('ok'); lb.textContent='已同步 '+t; }
  else if(state==='err'){ dot.classList.add('err'); lb.textContent='讀取失敗'; }
  else lb.textContent='載入中…';
}

/* ── 期間設定 ── */
function setRange(s, e){
  rangeStart = s; rangeEnd = e;
  document.getElementById('dStart').value = toISO(s);
  document.getElementById('dEnd').value   = toISO(e);
}
function applyPreset(key){
  const t = today(), y = t.getFullYear(), m = t.getMonth();
  let s, e;
  switch(key){
    case 'thisMonth': s=new Date(y,m,1); e=new Date(y,m+1,0); break;
    case 'nextMonth': s=new Date(y,m+1,1); e=new Date(y,m+2,0); break;
    case 'q': { const q=Math.floor(m/3); s=new Date(y,q*3,1); e=new Date(y,q*3+3,0); break; }
    case 'h1': s=new Date(y,0,1); e=new Date(y,5,30); break;
    case 'h2': s=new Date(y,6,1); e=new Date(y,11,31); break;
    case 'year': s=new Date(y,0,1); e=new Date(y,11,31); break;
    case 'all': {
      if(allEvents.length===0){ s=new Date(y,0,1); e=new Date(y,11,31); break; }
      const starts=allEvents.map(x=>fromISO(x.start)), ends=allEvents.map(x=>fromISO(x.end));
      s=new Date(Math.min(...starts)); e=new Date(Math.max(...ends));
      s=addDays(s,-3); e=addDays(e,3);
      break;
    }
  }
  s.setHours(0,0,0,0); e.setHours(0,0,0,0);
  setRange(s,e); refreshAll();
}
function clearPresetHighlight(){
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('on'));
}

/* ── 分類篩選膠囊 ── */
function buildFilters(){
  const used = [...new Set(allEvents.map(e=>e.cat))].filter(c=>CATS[c])
                .sort((a,b)=>CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b));
  const box = document.getElementById('filters');
  box.innerHTML='';

  const allOn = used.every(c=>activeFilters.has(c));
  const ap = document.createElement('span');
  ap.className = 'pill ' + (allOn?'on':'off');
  if(allOn) ap.style.cssText = 'border-color:#3C3489;color:#3C3489;background:rgba(60,52,137,.06)';
  ap.textContent = '全部類型';
  ap.onclick = ()=>{ activeFilters=new Set(CAT_ORDER); refreshAll(); };
  box.appendChild(ap);

  for(const cat of used){
    const c = getCat(cat), on = activeFilters.has(cat);
    const p = document.createElement('span');
    p.className = 'pill ' + (on?'on':'off');
    if(on) p.style.cssText = `border-color:${c.color};color:${c.color};background:${c.color}0e`;
    p.innerHTML = `<span class="dot" style="background:${c.color}"></span>${cat}`;
    p.onclick = ()=>{
      activeFilters.has(cat) ? activeFilters.delete(cat) : activeFilters.add(cat);
      refreshAll();
    };
    box.appendChild(p);
  }
}

/* ── 項目挑選面板 ── */
function eventsInRange(){
  if(!rangeStart||!rangeEnd) return allEvents;
  return allEvents.filter(e=> fromISO(e.end)>=rangeStart && fromISO(e.start)<=rangeEnd );
}

function buildManager(){
  // 只列出「分類有開啟」的活動，依分類分組
  const pool = allEvents
    .filter(e=>activeFilters.has(e.cat))
    .sort((a,b)=>{
      const o=CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat);
      return o!==0?o:a.start.localeCompare(b.start);
    });

  const byCat = {};
  for(const e of pool){ (byCat[e.cat] ||= []).push(e); }

  const wrap = document.getElementById('mgrGroups');
  wrap.innerHTML = '';

  if(pool.length===0){
    wrap.innerHTML = `<div style="font-size:12px;color:var(--text-3);padding:4px 0">目前沒有可挑選的活動</div>`;
  }

  for(const cat of CAT_ORDER){
    const list = byCat[cat];
    if(!list || !list.length) continue;
    const c = getCat(cat);

    const g = document.createElement('div');
    g.className = 'manager-group';

    const head = document.createElement('div');
    head.className = 'manager-group-head';
    head.innerHTML = `<span class="gdot" style="background:${c.color}"></span>${cat}
      <span style="color:var(--text-3);font-weight:400">（${list.length}）</span>`;

    const bOn = document.createElement('button');
    bOn.textContent = '全選';
    bOn.onclick = ()=>{ list.forEach(e=>hiddenIds.delete(e.id)); refreshAll(); };
    const bOff = document.createElement('button');
    bOff.textContent = '全不選';
    bOff.style.marginLeft = '2px';
    bOff.onclick = ()=>{ list.forEach(e=>hiddenIds.add(e.id)); refreshAll(); };
    head.appendChild(bOn); head.appendChild(bOff);
    g.appendChild(head);

    const ul = document.createElement('div');
    ul.className = 'item-list';
    for(const e of list){
      const on = !hiddenIds.has(e.id);
      const lab = document.createElement('label');
      lab.className = 'item-check' + (on?'':' off');
      lab.title = `${e.name}｜${e.start} ~ ${e.end}`;
      lab.innerHTML = `
        <input type="checkbox" ${on?'checked':''}>
        <span>${e.name}</span>
        <span class="item-date">${shortDate(e.start)}–${shortDate(e.end)}</span>`;
      lab.querySelector('input').onchange = ev=>{
        ev.target.checked ? hiddenIds.delete(e.id) : hiddenIds.add(e.id);
        refreshAll();
      };
      ul.appendChild(lab);
    }
    g.appendChild(ul);
    wrap.appendChild(g);
  }

  // 隱藏計數
  const activePool = allEvents.filter(e=>activeFilters.has(e.cat));
  const nHidden = activePool.filter(e=>hiddenIds.has(e.id)).length;
  const cnt = document.getElementById('hiddenCount');
  cnt.innerHTML = nHidden > 0
    ? `<i class="ti ti-eye-off" style="font-size:13px"></i>已隱藏 ${nHidden} 項
       <button class="btn sm" style="margin-left:4px" onclick="window.__showAll()">全部顯示</button>`
    : '';
}
window.__showAll = ()=>{ hiddenIds.clear(); refreshAll(); };

/* ── 渲染甘特圖 ── */
function render(){
  if(!rangeStart||!rangeEnd) return;
  const base=rangeStart, end=rangeEnd;
  const totalDays = diffDays(base,end)+1;
  if(totalDays<1){
    document.getElementById('gantt').innerHTML =
      `<div class="state-box"><i class="ti ti-alert-circle"></i>結束日期不能早於開始日期</div>`;
    return;
  }

  const INFO_W = 200;
  const TL_W   = 660;
  const dayW   = TL_W / totalDays;
  const showDayNums = dayW >= 13;
  const todayISO = toISO(today());

  /* 月份列 */
  let monthsHtml='';
  {
    const segs=[];
    let cur=new Date(base), curKey=null, curLabel='', segStart=0;
    for(let i=0;i<totalDays;i++){
      const key = cur.getFullYear()+'-'+cur.getMonth();
      if(key!==curKey){
        if(curKey!==null) segs.push({label:curLabel, count:i-segStart});
        curKey=key; segStart=i;
        curLabel = (cur.getMonth()===0 || i===0)
          ? `${cur.getFullYear()}/${cur.getMonth()+1}月`
          : `${cur.getMonth()+1}月`;
      }
      cur=addDays(cur,1);
    }
    segs.push({label:curLabel, count:totalDays-segStart});
    for(const s of segs)
      monthsHtml += `<div class="month-cell" style="width:${s.count*dayW}px">${s.count*dayW>34?s.label:''}</div>`;
  }

  /* 刻度列 */
  let ticksHtml='';
  {
    let cur=new Date(base);
    for(let i=0;i<totalDays;i++){
      const isT = toISO(cur)===todayISO;
      const dow = cur.getDay();
      const wk  = (dow===0||dow===6) ? ' weekend' : '';
      const lbl = showDayNums ? cur.getDate() : (cur.getDate()===1 ? '·' : '');
      ticksHtml += `<div class="tick-cell${isT?' is-today':''}${wk}" style="width:${dayW}px">${lbl}</div>`;
      cur=addDays(cur,1);
    }
  }

  const tOff = diffDays(base, today());
  const todayPx = (tOff>=0 && tOff<totalDays) ? tOff*dayW : -9999;

  /* 篩出可見活動：分類開啟 + 未被個別隱藏 + 落在期間內 */
  const visible = allEvents
    .filter(e=>{
      if(!activeFilters.has(e.cat)) return false;
      if(hiddenIds.has(e.id)) return false;
      return fromISO(e.end) >= base && fromISO(e.start) <= end;
    })
    .sort((a,b)=>{
      const o = CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat);
      return o!==0 ? o : a.start.localeCompare(b.start);
    });

  let rows='';
  if(visible.length===0){
    rows = `<div class="state-box"><i class="ti ti-calendar-off"></i>這個期間沒有可顯示的活動<br><small>試著調整日期範圍、分類篩選，或在「挑選顯示項目」中開啟</small></div>`;
  } else {
    for(const e of visible){
      const es=fromISO(e.start), ee=fromISO(e.end);
      const rawS = diffDays(base, es);
      const rawE = diffDays(base, ee)+1;
      const s0 = Math.max(0, rawS);
      const e0 = Math.min(totalDays, rawE);
      const bL = s0*dayW;
      const bW = Math.max(4, (e0-s0)*dayW);
      const c  = getCat(e.cat);
      const clip = (rawS<0?' clip-l':'') + (rawE>totalDays?' clip-r':'');
      const days = diffDays(es,ee)+1;
      rows += `
        <div class="gantt-row" style="grid-template-columns:${INFO_W}px 1fr">
          <div class="row-info">
            <div class="row-text">
              <div class="row-name" title="${e.name}">${e.name}</div>
              <span class="row-badge" style="background:${c.color}1a;color:${c.color}">${e.cat}</span>
            </div>
            <button class="row-hide" data-hide="${e.id}" title="隱藏這一項"><i class="ti ti-eye-off"></i></button>
          </div>
          <div class="row-timeline">
            <div class="today-line" style="left:${todayPx}px"></div>
            <div class="bar${clip}" style="left:${bL}px;width:${bW}px;background:${c.color};color:#fff"
                 title="${e.name}&#10;${e.start} ~ ${e.end}（${days} 天）">
              ${bW>58 ? e.name : ''}
            </div>
          </div>
        </div>`;
    }
  }

  document.getElementById('gantt').innerHTML = `
    <div class="gantt-head" style="grid-template-columns:${INFO_W}px 1fr">
      <div class="head-label">活動名稱</div>
      <div>
        <div class="months-row">${monthsHtml}</div>
        <div class="ticks-row">${ticksHtml}</div>
      </div>
    </div>
    ${rows}`;

  document.querySelectorAll('[data-hide]').forEach(b=>{
    b.onclick = ()=>{ hiddenIds.add(b.dataset.hide); refreshAll(); };
  });

  renderLegend(visible);
}

function renderLegend(visible){
  const used=[...new Set(visible.map(e=>e.cat))].filter(c=>CATS[c]);
  const main=used.filter(k=>CATS[k].group==='main').sort((a,b)=>CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b));
  const kol =used.filter(k=>CATS[k].group==='kol').sort((a,b)=>CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b));
  let h='';
  if(main.length){
    h+='<div><div class="legend-title">合作類型</div>';
    for(const k of main) h+=`<div class="legend-item"><span class="legend-dot" style="background:${CATS[k].color}"></span>${k}</div>`;
    h+='</div>';
  }
  if(kol.length){
    h+='<div><div class="legend-title">KOL</div>';
    for(const k of kol) h+=`<div class="legend-item"><span class="legend-dot" style="background:${CATS[k].color}"></span>${k.replace('KOL - ','')}</div>`;
    h+='</div>';
  }
  document.getElementById('legendArea').innerHTML=h;
}

/* 一次更新三個區塊 */
function refreshAll(){
  buildFilters();
  buildManager();
  render();
}

/* ── 載入 ── */
async function loadAll(){
  setSync('loading');
  try{
    allEvents = await fetchSheets();
    setSync('ok', new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
    if(!rangeStart) applyPreset('q');
    else refreshAll();
  }catch(err){
    setSync('err');
    document.getElementById('gantt').innerHTML =
      `<div class="state-box"><i class="ti ti-cloud-off"></i>無法讀取試算表<br><small>請確認共用設定為「知道連結的人 → 檢視者」</small></div>`;
  }
}

/* ── 事件綁定 ── */
document.getElementById('dStart').addEventListener('change', e=>{
  if(!e.target.value) return;
  rangeStart = fromISO(e.target.value); clearPresetHighlight(); refreshAll();
});
document.getElementById('dEnd').addEventListener('change', e=>{
  if(!e.target.value) return;
  rangeEnd = fromISO(e.target.value); clearPresetHighlight(); refreshAll();
});
document.querySelectorAll('.preset').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    clearPresetHighlight(); btn.classList.add('on');
    applyPreset(btn.dataset.preset);
  });
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  clearPresetHighlight();
  const t=today();
  setRange(addDays(t,-14), addDays(t,45));
  refreshAll();
});
document.getElementById('refreshBtn').addEventListener('click', loadAll);

/* 項目面板開合 */
const mgrPanel = document.getElementById('mgrPanel');
const mgrToggle = document.getElementById('mgrToggle');
const mgrChevron = document.getElementById('mgrChevron');
mgrToggle.addEventListener('click', ()=>{
  const open = mgrPanel.style.display === 'none';
  mgrPanel.style.display = open ? '' : 'none';
  mgrToggle.classList.toggle('open', open);
  mgrChevron.className = open ? 'ti ti-chevron-up' : 'ti ti-chevron-down';
  mgrChevron.style.fontSize = '13px';
});

document.getElementById('mgrAll').onclick    = ()=>{ hiddenIds.clear(); refreshAll(); };
document.getElementById('mgrNone').onclick   = ()=>{
  allEvents.filter(e=>activeFilters.has(e.cat)).forEach(e=>hiddenIds.add(e.id));
  refreshAll();
};
document.getElementById('mgrInvert').onclick = ()=>{
  allEvents.filter(e=>activeFilters.has(e.cat)).forEach(e=>{
    hiddenIds.has(e.id) ? hiddenIds.delete(e.id) : hiddenIds.add(e.id);
  });
  refreshAll();
};
document.getElementById('mgrInRange').onclick = ()=>{
  const inR = new Set(eventsInRange().map(e=>e.id));
  allEvents.forEach(e=>{ inR.has(e.id) ? hiddenIds.delete(e.id) : hiddenIds.add(e.id); });
  refreshAll();
};

/* 截圖模式 */
document.getElementById('shotBtn').onclick  = ()=> document.body.classList.add('shot-mode');
document.getElementById('shotExit').onclick = ()=> document.body.classList.remove('shot-mode');
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.body.classList.remove('shot-mode');
});

loadAll();
</script>
</body>
